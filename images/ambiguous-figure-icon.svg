<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="84" height="84" role="img" aria-label="見方によって二通りに読み取れることを表す抽象アイコン。円の左半分は点の模様、右半分は斜線の模様で、中央に疑問符がある。">
  <title>多義図形のイメージ(見方によって違うものに見える)</title>
  <defs>
    <clipPath id="circleClip"><circle cx="50" cy="50" r="46"/></clipPath>
    <clipPath id="leftRect"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <clipPath id="rightRect"><rect x="50" y="0" width="50" height="100"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <g clip-path="url(#circleClip)">
    <g clip-path="url(#leftRect)">
      <circle cx="25" cy="30" r="3" fill="#2a78d6"/>
      <circle cx="35" cy="45" r="3" fill="#2a78d6"/>
      <circle cx="20" cy="55" r="3" fill="#2a78d6"/>
      <circle cx="30" cy="70" r="3" fill="#2a78d6"/>
      <circle cx="15" cy="70" r="3" fill="#2a78d6"/>
    </g>
    <g clip-path="url(#rightRect)" stroke="#2a78d6" stroke-width="2">
      <line x1="58" y1="10" x2="92" y2="44"/>
      <line x1="55" y1="30" x2="89" y2="64"/>
      <line x1="55" y1="50" x2="89" y2="84"/>
      <line x1="58" y1="72" x2="86" y2="100"/>
    </g>
  </g>
  <line x1="50" y1="6" x2="50" y2="94" stroke="#1c5cab" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="50" y="59" font-size="24" text-anchor="middle" fill="#1c5cab" font-weight="bold" font-family="sans-serif">?</text>
</svg>
