<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="地図の抽象化前と抽象化後の比較図">
  <title>地図の抽象化(抽象化前 → 抽象化後)</title>
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <rect x="0" y="20" width="260" height="210" fill="#fbfbfa" stroke="#b9c2cc"/>
  <rect x="380" y="20" width="260" height="210" fill="#fbfbfa" stroke="#b9c2cc"/>
  <text x="130" y="14" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold" font-family="sans-serif">抽象化前:地図上のすべての情報</text>
  <text x="510" y="14" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold" font-family="sans-serif">抽象化後:目的地までに必要な情報だけ</text>

  <line x1="20" y1="120" x2="240" y2="120" stroke="#9aa5b1" stroke-width="4"/>
  <line x1="140" y1="30" x2="140" y2="220" stroke="#9aa5b1" stroke-width="4"/>
  <path d="M20 200 C 80 180, 100 140, 90 60" stroke="#6fa8dc" stroke-width="5" fill="none"/>
  <text x="45" y="55" font-size="10" fill="#3a6ea5" font-family="sans-serif">川</text>

  <circle cx="200" cy="55" r="14" fill="#8fbf7f"/>
  <text x="200" y="59" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">公園</text>

  <rect x="30" y="40" width="34" height="20" fill="#d98c7a"/>
  <text x="47" y="54" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">銀行</text>

  <rect x="165" y="150" width="42" height="20" fill="#e0b23c"/>
  <text x="186" y="164" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">コンビニ</text>

  <polygon points="60,150 80,190 40,190" fill="#b98cd9"/>
  <text x="60" y="182" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">GS</text>

  <rect x="200" y="185" width="34" height="22" fill="#5c8ca6"/>
  <text x="217" y="200" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">駅</text>

  <circle cx="140" cy="120" r="6" fill="#333"/>
  <text x="150" y="112" font-size="9" fill="#333" font-family="sans-serif">都電</text>

  <rect x="30" y="185" width="30" height="16" fill="#9aa5b1"/>
  <text x="45" y="197" font-size="8" text-anchor="middle" fill="#fff" font-family="sans-serif">家</text>

  <text x="230" y="130" font-size="9" fill="#9aa5b1" font-family="sans-serif">JR</text>

  <line x1="270" y1="125" x2="365" y2="125" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="317" y="112" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="sans-serif">抽象化</text>
  <text x="317" y="145" font-size="10" text-anchor="middle" fill="#c0392b" font-family="sans-serif">必要な情報だけを取り出す</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <circle cx="410" cy="190" r="7" fill="#c0392b"/>
  <text x="410" y="212" font-size="10" text-anchor="middle" fill="#333" font-family="sans-serif">現在地</text>

  <rect x="480" y="90" width="42" height="20" fill="#e0b23c"/>
  <text x="501" y="104" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">コンビニ</text>
  <text x="501" y="122" font-size="9" text-anchor="middle" fill="#666" font-family="sans-serif">(目印)</text>

  <rect x="580" y="35" width="34" height="22" fill="#5c8ca6"/>
  <text x="597" y="50" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif">駅</text>
  <text x="597" y="68" font-size="9" text-anchor="middle" fill="#666" font-family="sans-serif">(目的地)</text>

  <path d="M410 190 L 500 105 L 597 50" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
</svg>
